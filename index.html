<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiểu Thuyết Mạng - Trang Chủ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 40px; }
        header { background-color: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        .logo { display: flex; align-items: center; gap: 8px; color: #f97316; font-weight: 700; font-size: 1.1rem; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .section-title { color: #ef4444; font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
        .section-desc { color: #64748b; font-size: 0.85rem; margin-bottom: 15px; }
        
        .story-card {
            background: #ffffff; border-radius: 12px; padding: 12px;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px; border: 1px solid #f1f5f9;
        }
        .story-card-top { display: flex; gap: 12px; position: relative; }
        
        /* Biến ảnh thành vùng bấm được */
        .thumb-wrapper {
            position: relative; width: 100px; height: 135px; flex-shrink: 0;
            display: block; cursor: pointer;
        }
        .story-thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .audio-badge {
            position: absolute; top: 6px; left: 6px; background: #0284c7; color: white;
            font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 600;
            z-index: 2; pointer-events: none;
        }
        
        .story-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Biến tiêu đề thành liên kết bấm được */
        .story-title-link {
            text-decoration: none;
            color: #0f172a;
            font-size: 0.95rem; font-weight: 700; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            transition: color 0.2s;
        }
        .story-title-link:hover {
            color: #ef4444;
        }

        .story-meta-list { display: flex; flex-direction: column; gap: 3px; font-size: 0.8rem; color: #64748b; }
        
        .btn-audio {
            background: #ef4444; color: white; border: none; width: 100%; padding: 10px;
            border-radius: 8px; font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
            text-decoration: none; text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo"><i class="fa-solid fa-book-open"></i> Tiểu Thuyết Mạng</div>
    </header>

    <div class="container">
        <div class="section-title">Truyện Audio</div>
        <div class="section-desc">Vừa đọc vừa nghe — trải nghiệm truyện theo cách mới</div>

        <div class="story-card">
            <div class="story-card-top">
                <!-- Bấm vào ảnh bìa chuyển sang trang đọc -->
                <a href="doc-truyen.html?id=1" class="thumb-wrapper">
                    <span class="audio-badge"><i class="fa-solid fa-headphones"></i> Audio</span>
                    <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=300&q=80" class="story-thumb">
                </a>
                <div class="story-info">
                    <!-- Bấm vào tiêu đề truyện chuyển sang trang đọc -->
                    <a href="doc-truyen.html?id=1" class="story-title-link">
                        Bắc Hầu Thế Tử: Ta là phản diện với thân thế nghịch thiên
                    </a>
                    <div class="story-meta-list">
                        <div><i class="fa-regular fa-user"></i> Bất Vũ Chi Tiêu</div>
                        <div><i class="fa-solid fa-bookmark"></i> Đang ra &bull; 105 chương</div>
                        <div><i class="fa-regular fa-eye"></i> 13,6k &bull; 03/09/2026</div>
                    </div>
                </div>
            </div>
            
            <a href="doc-truyen.html?id=1" class="btn-audio">
                <i class="fa-solid fa-headphones"></i> Nghe & Đọc Truyện
            </a>
        </div>
    </div>
</body>
</html>
