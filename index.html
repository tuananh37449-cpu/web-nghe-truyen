<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc & Nghe Truyện - Web Truyện Mạng</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --accent-color: #0284c7;
            --border-color: #e2e8f0;
        }

        [data-theme="sepia"] {
            --bg-color: #fbf0d9;
            --card-bg: #f4e4bc;
            --text-color: #5f4b32;
            --text-muted: #8c7355;
            --accent-color: #a0522d;
            --border-color: #e6d2a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.1rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-tools {
            display: flex;
            gap: 10px;
        }

        .tool-btn {
            background: var(--border-color);
            border: none;
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .container {
            display: flex;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            gap: 20px;
            flex: 1;
            padding-bottom: 130px;
        }

        /* Khu vực đọc nội dung chữ */
        .reader-main {
            flex: 3;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .reader-main h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--accent-color);
        }

        .chapter-content {
            font-family: 'Merriweather', serif;
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* Sidebar danh sách chương */
        .sidebar {
            flex: 1.5;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
            max-height: 500px;
            overflow-y: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .sidebar h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
        }

        .chapter-link {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: var(--bg-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chapter-link:hover {
            opacity: 0.8;
        }

        .chapter-link.active {
            border-left: 3px solid var(--accent-color);
            font-weight: 600;
        }

        /* Thanh Audio Player Cố Định Dưới Đáy */
        .audio-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.1);
        }

        .player-info {
            width: 25%;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 50%;
            gap: 4px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-controls button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.1rem;
            cursor: pointer;
        }

        .player-controls .main-play {
            background: var(--accent-color);
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-box {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            background: var(--border-color);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            border-radius: 3px;
        }

        /* Responsive cho Mobile */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                max-height: 250px;
            }
            .player-info {
                display: none;
            }
            .player-center {
                width: 100%;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <h1><i class="fa-solid fa-book-open"></i> Đọc Truyện Online</h1>
        <div class="header-tools">
            <button class="tool-btn" onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i> Giao diện</button>
            <button class="tool-btn" onclick="adjustFont()"><i class="fa-solid fa-font"></i> Cỡ chữ</button>
        </div>
    </header>

    <div class="container">
        <!-- Khung đọc chữ chính -->
        <div class="reader-main">
            <h2 id="chap-title">Đang tải chương...</h2>
            <div class="chapter-content" id="chap-text">
                Nội dung chương truyện sẽ hiển thị ở đây để bạn vừa có thể đọc lướt vừa kết hợp nghe âm thanh trực quan bên dưới.
            </div>
        </div>

        <!-- Danh sách chương truyện -->
        <div class="sidebar">
            <h3>Danh sách chương</h3>
            <div id="playlist"></div>
        </div>
    </div>

    <!-- Thanh phát âm thanh -->
    <div class="audio-player">
        <div class="player-info" id="player-title">Chọn chương để bắt đầu</div>
        <div class="player-center">
            <div class="player-controls">
                <button onclick="prevChapter()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="main-play" onclick="togglePlay()"><i class="fa-solid fa-play" id="play-icon"></i></button>
                <button onclick="nextChapter()"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-box">
                <span id="current-time">00:00</span>
                <div class="progress-bar" id="progress-bar" onclick="seekAudio(event)">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="duration">00:00</span>
            </div>
        </div>
        <div style="width: 25%; text-align: right;">
            <button class="tool-btn" onclick="readByVoice()"><i class="fa-solid fa-microphone-lines"></i> Đọc giọng đọc</button>
        </div>
    </div>

    <audio id="audio-elem"></audio>

    <script>
        // Dữ liệu mẫu gồm cả Tiêu đề, Nội dung chữ và Link Audio (hoặc dùng Web Speech API)
        const storyData = [
            {
                title: "Chương 1: Khởi đầu mới",
                text: "Linh khí trời đất bỗng nhiên biến đổi, dòng năng lượng cuồn cuộn đổ về từ hư không. Giữa khung cảnh hỗn loạn ấy, một nhân vật vô danh bước ra từ cõi sương mù, bắt đầu hành trình nghịch thiên thay đổi vận mệnh...",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            },
            {
                title: "Chương 2: Bí cảnh xuất thế",
                text: "Từng đạo hào quang chói lọi phóng lên tận chín tầng mây. Các đại thế gia đồng loạt chuyển động, hướng ánh mắt tham lam về phía dãy núi nguyên thủy vừa lôi kéo vô số dị tượng kỳ bí...",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
            },
            {
                title: "Chương 3: Phong vân nổi dậy",
                text: "Giữa lằn ranh sinh tử, tiềm lực ẩn giấu bên trong cơ thể cuối cùng cũng được khai phá. Một quyền tung ra, không khí xung quanh chấn động nổ tung thành từng tiếng gầm rú đinh tai nhức óc...",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            }
        ];

        let currentIndex = 0;
        const audio = document.getElementById('audio-elem');
        const playIcon = document.getElementById('play-icon');
        const chapTitle = document.getElementById('chap-title');
        const chapText = document.getElementById('chap-text');
        const playerTitle = document.getElementById('player-title');
        const playlistEl = document.getElementById('playlist');
        const progressFill = document.getElementById('progress-fill');
        const progressBar = document.getElementById('progress-bar');
        
        let fontSizeLevel = 1; // 0: nhỏ, 1: vừa, 2: lớn

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            storyData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `chapter-link ${index === currentIndex ? 'active' : ''}`;
                div.innerHTML = `<span>${item.title}</span> <i class="fa-solid fa-chevron-right" style="font-size:0.75rem; color:var(--text-muted)"></i>`;
                div.onclick = () => {
                    currentIndex = index;
                    loadChapter();
                    playAudio();
                };
                playlistEl.appendChild(div);
            });
        }

        function loadChapter() {
            chapTitle.innerText = storyData[currentIndex].title;
            chapText.innerText = storyData[currentIndex].text;
            playerTitle.innerText = storyData[currentIndex].title;
            audio.src = storyData[currentIndex].audio;
            renderPlaylist();
        }

        function playAudio() {
            audio.play();
            playIcon.classList.replace('fa-play', 'fa-pause');
        }

        function togglePlay() {
            if (audio.paused) {
                if(!audio.src) loadChapter();
                audio.play();
                playIcon.classList.replace('fa-play', 'fa-pause');
            } else {
                audio.pause();
                playIcon.classList.replace('fa-pause', 'fa-play');
            }
        }

        function nextChapter() {
            currentIndex = (currentIndex + 1) % storyData.length;
            loadChapter();
            playAudio();
        }

        function prevChapter() {
            currentIndex = (currentIndex - 1 + storyData.length) % storyData.length;
            loadChapter();
            playAudio();
        }

        // Đổi giao diện (Dark / Light / Sepia)
        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            if (current === 'dark') {
                body.setAttribute('data-theme', 'light');
            } else if (current === 'light') {
                body.setAttribute('data-theme', 'sepia');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }

        // Thay đổi cỡ chữ bài đọc
        function adjustFont() {
            fontSizeLevel = (fontSizeLevel + 1) % 3;
            if (fontSizeLevel === 0) chapText.style.fontSize = "0.95rem";
            if (fontSizeLevel === 1) chapText.style.fontSize = "1.05rem";
            if (fontSizeLevel === 2) chapText.style.fontSize = "1.25rem";
        }

        // Tính năng đọc văn bản tự động bằng giọng nói của trình duyệt (Speech Synthesis)
        function readByVoice() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                audio.pause(); // Tạm dừng nhạc nền nếu có
                playIcon.classList.replace('fa-pause', 'fa-play');
                
                const utterance = new SpeechSynthesisUtterance(storyData[currentIndex].text);
                utterance.lang = 'vi-VN';
                utterance.rate = 1.0; // Tốc độ đọc
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Trình duyệt của bạn không hỗ trợ tính năng đọc giọng nói.");
            }
        }

        // Cập nhật thanh tiến trình audio
        audio.addEventListener('timeupdate', (e) => {
            const { currentTime, duration } = e.target;
            if (duration) {
                progressFill.style.width = `${(currentTime / duration) * 100}%`;
                
                let curMin = Math.floor(currentTime / 60);
                let curSec = Math.floor(currentTime % 60);
                if(curSec < 10) curSec = `0${curSec}`;
                document.getElementById('current-time').innerText = `${curMin}:${curSec}`;

                let durMin = Math.floor(duration / 60);
                let durSec = Math.floor(duration % 60);
                if(durSec < 10) durSec = `0${durSec}`;
                document.getElementById('duration').innerText = `${durMin}:${durSec}`;
            }
        });

        function seekAudio(e) {
            const width = progressBar.clientWidth;
            audio.currentTime = (e.offsetX / width) * audio.duration;
        }

        audio.addEventListener('ended', nextChapter);

        // Khởi chạy lần đầu
        loadChapter();
    </script>
</body>
</html>
